# 禾下美学院｜本地开发编排
# 启动（在项目根目录执行）：
#   docker compose --env-file .env -f deploy/docker-compose.dev.yml up -d --build
#
# 说明：
# - Taro 小程序在宿主机使用微信开发者工具运行，不进入 Docker。
# - admin-web 使用 Node 容器运行 Vite 开发服务器。
# - FastAPI 挂载源码并开启 --reload。
# - MySQL / Redis 仅用于本地开发，数据保存在命名卷中。

name: huahuo-spark-dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-huahuo_spark}
      MYSQL_USER: ${MYSQL_USER:-spark}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - spark_dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - spark_dev

  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      # 容器内使用 Compose 服务名，覆盖 .env 中面向宿主机的 DATABASE_URL
      DATABASE_URL: "mysql+aiomysql://${MYSQL_USER:-spark}:${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-huahuo_spark}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      TZ: Asia/Shanghai
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ./secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - spark_dev

  admin-web:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
      # Windows / macOS 宿主机挂载时提升文件监听可靠性
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../admin-web:/app
      - admin_web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - spark_dev

volumes:
  mysql_dev_data:
  redis_dev_data:
  admin_web_node_modules:

networks:
  spark_dev:
    driver: bridge
