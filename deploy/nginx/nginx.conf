user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 上传上限：与 VOD_UPLOAD_MAX_SIZE_MB 对齐（视频经后端中转上传）
    client_max_body_size 2048m;
    client_body_timeout 600s;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # 80 强制跳转 443
    server {
        listen      80;
        listen      [::]:80;
        server_name api.qinghebacademy.cn;

        return 301 https://$host$request_uri;
    }

    # 生产 HTTPS 入口
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name api.qinghebacademy.cn;

        root /usr/share/nginx/html;

        # Docker 内置 DNS：FastAPI 容器重建后无需重启 Nginx 也能解析新地址
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fastapi_upstream "http://fastapi:8000";

        # 证书由 deploy/nginx/certs/ 挂载；部署前必须替换为真实证书
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 关闭 Swagger / ReDoc / OpenAPI 暴露
        location ~ ^/(?:api(?:/v1)?/)?(?:docs(?:/oauth2-redirect)?|redoc|openapi\.json)$ {
            return 404;
        }

        # 微信虚拟支付消息推送：精确匹配，避免继承视频上传的 2GB 上限与
        # 600s 超时；微信要求 3~5 秒内应答，报文很小。
        location = /api/wx/xpay/callback {
            proxy_pass              $fastapi_upstream;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection        "";
            client_max_body_size    48k;
            client_body_timeout     15s;
            proxy_connect_timeout   10s;
            proxy_send_timeout      15s;
            proxy_read_timeout      15s;
        }

        # FastAPI 反向代理（保留原始 /api 路径）
        location /api/ {
            proxy_pass              $fastapi_upstream;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection        "";
            # 视频上传经 FastAPI 中转：关闭请求缓冲，避免 2GB 级文件先落满 Nginx 磁盘
            proxy_request_buffering off;
            proxy_connect_timeout   10s;
            proxy_send_timeout      600s;
            proxy_read_timeout      600s;
            client_max_body_size    2048m;
        }

        # B 端静态资源（Vite 构建时 base 必须为 /admin/）
        location ^~ /admin/assets/ {
            try_files $uri =404;
            expires 1y;
        }

        # B 端 React History 路由回退
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            try_files $uri $uri/ /admin/index.html;
            expires -1;
        }

        # 域名根路径进入管理后台
        location = / {
            return 302 /admin/;
        }

        location / {
            return 404;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
